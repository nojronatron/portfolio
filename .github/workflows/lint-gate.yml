name: ESLint Gate

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege for GITHUB_TOKEN: only read repository contents.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NodeJS (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Use lockfile-based install for reproducibility; ESLint should be in devDependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint
